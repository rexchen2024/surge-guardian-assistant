name: 问题报告
description: 报告一个可以复现的问题。
title: "问题："
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请不要粘贴原始 Surge profile、订阅 URL、节点凭据、请求日志、DNS dump、token、真实域名或真实 IP。
  - type: textarea
    id: summary
    attributes:
      label: 简要说明
      description: 哪里不对？
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 运行 `scripts/surge-guardian-assistant version`。
      placeholder: "0.1.0"
    validations:
      required: false
  - type: dropdown
    id: edition
    attributes:
      label: 使用方式
      options:
        - Hermes 版本
        - Codex 版本
        - 不确定
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 注意脱敏。
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: 预期表现
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: 实际表现
    validations:
      required: false
